name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Show environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME" || true
          java -version

      - name: Build Mat Weather, bundle it, build Mat Launcher
        run: |
          set -o pipefail
          {
            chmod +x gradlew
            ./gradlew --no-daemon --stacktrace :weather:assembleRelease
            mkdir -p app/src/main/assets
            cp weather/build/outputs/apk/release/weather-release.apk app/src/main/assets/mat-weather.apk
            ./gradlew --no-daemon --stacktrace :app:assembleRelease
          } 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Collect outputs
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          cp "$RUNNER_TEMP/build.log" "$RUNNER_TEMP/out/build.log" || echo "no build.log (an earlier step failed)" > "$RUNNER_TEMP/out/build.log"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/out/MatLauncher.apk" || true
          cp weather/build/outputs/apk/release/weather-release.apk "$RUNNER_TEMP/out/MatWeather.apk" || true
          ls -la "$RUNNER_TEMP/out"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mat-launcher-apks
          path: ${{ runner.temp }}/out/

      - name: Auto-release when the version number is new (pushes to main)
        if: github.ref == 'refs/heads/main' && success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          VER=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          TAG="v$VER"
          echo "versionName=$VER"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists, nothing to do."
            exit 0
          fi
          if [ -f "release-notes/$TAG.md" ]; then
            NOTES=(--notes-file "release-notes/$TAG.md")
          else
            NOTES=(--generate-notes)
          fi
          gh release create "$TAG" \
            "$RUNNER_TEMP/out/MatLauncher.apk" \
            "$RUNNER_TEMP/out/MatWeather.apk" \
            --target "$GITHUB_SHA" \
            --title "Mat Launcher $VER" \
            "${NOTES[@]}"

      - name: Publish build output to the apk-build branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan apk-build
          git rm -rf . > /dev/null 2>&1 || true
          cp "$RUNNER_TEMP"/out/* .
          printf '%s\n' "Built from ${GITHUB_SHA}" > BUILT_FROM.txt
          git add -A
          git commit -m "Build output for ${GITHUB_SHA}"
          git push -f origin apk-build

      - name: Create GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ runner.temp }}/out/MatLauncher.apk
            ${{ runner.temp }}/out/MatWeather.apk
          generate_release_notes: true
